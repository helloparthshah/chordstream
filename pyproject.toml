[project]
name = "chordstream"
version = "0.1.0"
description = "Real-time, zero-lookahead live audio to chord progression recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# Everything needed to build datasets, train, and export. Not installed in the Docker image.
train = [
    "torch>=2.4",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "tqdm>=4.66",
]
# Local microphone / audio-interface client.
mic = ["sounddevice>=0.4", "soundcard>=0.4.3"]
# Sung-word timestamps for lyric alignment (serve --asr small).
asr = ["faster-whisper>=1.1", "indic-transliteration>=2.3", "unidecode>=1.3"]
# "Now playing" detection for the synced chord sheet (Windows media session).
desktop = [
    "winrt-runtime>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.3; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.3; sys_platform == 'win32'",
]
fetch = [
    "imageio-ffmpeg>=0.8.1",
    "yt-dlp[default]>=2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chordstream = "chordstream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chordstream"]

# CUDA wheels for Windows/Linux dev machines; macOS falls back to PyPI.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
